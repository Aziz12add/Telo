name = "telo-web-proxy"
main = "worker.ts"
compatibility_date = "2024-01-01"
compatibility_flags = ["nodejs_compat"]

[durable_objects]
bindings = [{ name = "RELAY", class_name = "ProxySessionDO" }]

[[migrations]]
tag = "v1"
new_sqlite_classes = ["ProxySessionDO"]

[vars]
RELAY_DEBUG = "0"
RELAY_IDLE_TIMEOUT = "300"

[observability.logs]
enabled = false
